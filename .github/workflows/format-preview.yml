name: Temporary format preview

on:
  pull_request:
    branches: ["main"]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format target files
        run: npx prettier --write app/dashboard/page.tsx components/demo/continuity-workspace.tsx components/demo/demo-case-provider.tsx components/demo/report-workspace.tsx components/demo/review-workspace.tsx components/demo/signals-workspace.tsx lib/demo/demo-case-storage.ts
      - name: Print formatted files
        run: |
          echo "<<<FILE_0>>>"
          cat app/dashboard/page.tsx
          echo "<<<FILE_0_END>>>"
          echo "<<<FILE_1>>>"
          cat components/demo/continuity-workspace.tsx
          echo "<<<FILE_1_END>>>"
          echo "<<<FILE_2>>>"
          cat components/demo/demo-case-provider.tsx
          echo "<<<FILE_2_END>>>"
          echo "<<<FILE_3>>>"
          cat components/demo/report-workspace.tsx
          echo "<<<FILE_3_END>>>"
          echo "<<<FILE_4>>>"
          cat components/demo/review-workspace.tsx
          echo "<<<FILE_4_END>>>"
          echo "<<<FILE_5>>>"
          cat components/demo/signals-workspace.tsx
          echo "<<<FILE_5_END>>>"
          echo "<<<FILE_6>>>"
          cat lib/demo/demo-case-storage.ts
          echo "<<<FILE_6_END>>>"
